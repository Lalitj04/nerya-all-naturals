spring:
  application:
    name: nerya-all-naturals
  datasource:
    url: jdbc:mysql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}?sslMode=REQUIRED
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

admin:
  # LOCAL-DEV DEFAULT admin, seeded on first startup when no admin exists yet.
  # Override ADMIN_* (and change this password) in any real environment.
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}
  email: ${ADMIN_EMAIL:}

rate-limit:
  login:
    capacity: ${LOGIN_RATE_LIMIT_CAPACITY:5}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

payment:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

cloudinary:
  # Connection string from the Cloudinary dashboard:
  #   cloudinary://<api_key>:<api_secret>@<cloud_name>
  # Leave empty to disable uploads (the app still boots; upload endpoints then return an error).
  url: ${CLOUDINARY_URL:}
  # Base folder all uploads nest under; the media category is appended (e.g. nerya/hero).
  folder: ${CLOUDINARY_FOLDER:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    filter: true