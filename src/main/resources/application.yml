spring:
  application:
    name: nerya-all-naturals
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:testdb}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000} # 1 hour; refresh_tokens (30 days) renew it

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}
  email: ${ADMIN_EMAIL:}

media:
  google:
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS:}
    folders:
      HERO: ${DRIVE_FOLDER_HERO:}
      BANNER: ${DRIVE_FOLDER_BANNER:}
      PRODUCT: ${DRIVE_FOLDER_PRODUCT:}
      CATEGORY: ${DRIVE_FOLDER_CATEGORY:}
      GALLERY: ${DRIVE_FOLDER_GALLERY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    filter: true